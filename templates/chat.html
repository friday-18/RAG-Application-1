<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AdvocateAI</title>

	<!-- Apply saved theme before first paint to avoid a flash -->
	<script>
		(function () {
			var theme = null;
			try { theme = localStorage.getItem("theme"); } catch (e) {}
			if (!theme) {
				theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
			}
			document.documentElement.setAttribute("data-theme", theme);
		})();
	</script>

	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
	<div class="app">

		<header class="topbar">
			<div class="brand">
				<span class="brand-mark" aria-hidden="true">
					<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M8 20h8M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/></svg>
				</span>
				<span class="brand-name">AdvocateAI</span>
			</div>
			<div class="topbar-actions">
				<button type="button" id="newChat" class="ghost-btn" title="New chat">New chat</button>
				<button type="button" id="themeToggle" class="icon-btn" aria-label="Toggle light/dark theme" title="Toggle theme">
					<svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
					<svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
				</button>
			</div>
		</header>

		<main id="scroller" class="scroller">
			<div class="thread" id="thread">

				<!-- Empty state (hidden after the first message) -->
				<section id="empty" class="empty">
					<h1>How can I help you today?</h1>
					<p>Ask about your legal documents. Answers come with their sources.</p>
				</section>

			</div>
		</main>

		<footer class="composer-wrap">
			<form id="messageArea" class="composer" autocomplete="off">
				<textarea id="text" name="msg" rows="1" placeholder="Message AdvocateAI" aria-label="Message" required></textarea>
				<button type="submit" id="send" class="send-btn" aria-label="Send message" disabled>
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
				</button>
			</form>
			<p class="disclaimer">AdvocateAI answers from the documents provided and can make mistakes. It is not legal advice. Please verify with a qualified advocate.</p>
		</footer>

	</div>

	<script>
		(function () {
			var form = document.getElementById("messageArea");
			var input = document.getElementById("text");
			var sendBtn = document.getElementById("send");
			var thread = document.getElementById("thread");
			var scroller = document.getElementById("scroller");
			var empty = document.getElementById("empty");
			var busy = false;

			/* ---------- helpers ---------- */

			function scrollToBottom() {
				scroller.scrollTo({ top: scroller.scrollHeight, behavior: "smooth" });
			}

			function autosize() {
				input.style.height = "auto";
				input.style.height = Math.min(input.scrollHeight, 200) + "px";
			}

			function updateSendState() {
				sendBtn.disabled = busy || input.value.trim().length === 0;
			}

			function hideEmptyState() {
				if (empty && empty.parentNode) {
					empty.parentNode.removeChild(empty);
					empty = null;
				}
			}

			// Builds a message row. Text is always inserted with textContent,
			// so nothing the user (or the model) types can inject HTML.
			function addMessage(role, text) {
				var row = document.createElement("div");
				row.className = "msg " + role;

				if (role === "bot") {
					var avatar = document.createElement("div");
					avatar.className = "avatar";
					avatar.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M8 20h8M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/></svg>';
					row.appendChild(avatar);
				}

				var body = document.createElement("div");
				body.className = "bubble";
				if (text !== null && text !== undefined) body.textContent = text;
				row.appendChild(body);

				thread.appendChild(row);
				scrollToBottom();
				return body;
			}

			function showTyping() {
				var body = addMessage("bot", null);
				body.classList.add("typing");
				body.innerHTML = "<span></span><span></span><span></span>";
				return body;
			}

			/* ---------- sending ---------- */

			function send(text) {
				text = (text || "").trim();
				if (!text || busy) return;

				hideEmptyState();
				addMessage("user", text);

				input.value = "";
				autosize();
				busy = true;
				updateSendState();

				var typing = showTyping();

				fetch("/get", {
					method: "POST",
					headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
					body: new URLSearchParams({ msg: text })
				})
				.then(function (res) {
					if (!res.ok) throw new Error("HTTP " + res.status);
					return res.text();
				})
				.then(function (answer) {
					typing.classList.remove("typing");
					typing.textContent = answer;
				})
				.catch(function () {
					typing.classList.remove("typing");
					typing.classList.add("error");
					typing.textContent = "Something went wrong. Please try again.";
				})
				.finally(function () {
					busy = false;
					updateSendState();
					scrollToBottom();
					input.focus();
				});
			}

			/* ---------- events ---------- */

			form.addEventListener("submit", function (e) {
				e.preventDefault();
				send(input.value);
			});

			input.addEventListener("input", function () {
				autosize();
				updateSendState();
			});

			// Enter sends, Shift+Enter adds a new line
			input.addEventListener("keydown", function (e) {
				if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
					e.preventDefault();
					send(input.value);
				}
			});

			document.getElementById("newChat").addEventListener("click", function () {
				window.location.reload();
			});

			document.getElementById("themeToggle").addEventListener("click", function () {
				var root = document.documentElement;
				var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
				root.setAttribute("data-theme", next);
				try { localStorage.setItem("theme", next); } catch (e) {}
			});

			input.focus();
		})();
	</script>
</body>
</html>
